name: ahiLib - Update technology news

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_news.py'
      - 'scripts/news-requirements.txt'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write

concurrency:
  group: ahi-news-main
  cancel-in-progress: false

jobs:
  update-news:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r scripts/news-requirements.txt
      - name: Collect and rank news
        run: python scripts/update_news.py
      - name: Commit generated files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news
          if git diff --cached --quiet; then
            echo "No news changes."
            exit 0
          fi
          git commit -m "Update aHi technology news"
          git push origin HEAD:main
